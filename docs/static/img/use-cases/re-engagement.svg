<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reengageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background box -->
  <rect x="0" y="0" width="400" height="300" fill="url(#reengageGrad)" rx="16"/>
  
  <!-- Mobile device - centered and contained -->
  <rect x="150" y="50" width="100" height="200" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Notification - inside mobile -->
  <circle cx="230" cy="75" r="5" fill="#ef4444" opacity="0.8"/>
  <text x="230" y="78" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle">3</text>
  
  <!-- Welcome message - inside mobile -->
  <rect x="165" y="95" width="70" height="45" rx="6" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#8b5cf6" text-anchor="middle" opacity="0.7">Welcome Back!</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="7" fill="#8b5cf6" text-anchor="middle" opacity="0.5">7 days away</text>
  
  <!-- What's new - inside mobile -->
  <rect x="165" y="155" width="70" height="35" rx="5" fill="#8b5cf6" opacity="0.06"/>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="8" font-weight="500" fill="#8b5cf6" text-anchor="middle" opacity="0.6">What's New</text>
  <text x="200" y="182" font-family="Arial, sans-serif" font-size="7" fill="#8b5cf6" text-anchor="middle" opacity="0.4">3 features</text>
  
  <!-- Refresh icon - inside mobile -->
  <circle cx="200" cy="215" r="12" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M192 207 Q200 202 208 207" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M208 207 L205 204 M208 207 L205 210" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Return arrow - contained within bounds -->
  <path d="M80 150 L140 150" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M135 146 L140 150 L135 154" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
