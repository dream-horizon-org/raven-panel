<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="onboardingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background box -->
  <rect x="0" y="0" width="400" height="300" fill="url(#onboardingGrad)" rx="16"/>
  
  <!-- Mobile device - centered and contained -->
  <rect x="150" y="60" width="100" height="160" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  
  <!-- User icon - inside mobile -->
  <circle cx="200" cy="110" r="14" fill="#6366f1" opacity="0.15"/>
  <circle cx="200" cy="110" r="14" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <path d="M188 140 Q200 132 212 140" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Tooltip - contained within bounds -->
  <rect x="60" y="50" width="60" height="35" rx="5" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#6366f1" text-anchor="middle" opacity="0.6">Welcome</text>
  
  <!-- Arrow - contained -->
  <path d="M120 68 L140 100" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.3"/>
  <path d="M135 95 L140 100 L137 98" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.3"/>
  
  <!-- Step dots - inside mobile -->
  <circle cx="180" cy="200" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="195" cy="200" r="4" fill="#6366f1" opacity="0.2"/>
  <circle cx="210" cy="200" r="4" fill="#6366f1" opacity="0.2"/>
  
  <!-- Bottom hint - inside mobile -->
  <rect x="160" y="170" width="80" height="20" rx="4" fill="#6366f1" opacity="0.05" stroke="#6366f1" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
