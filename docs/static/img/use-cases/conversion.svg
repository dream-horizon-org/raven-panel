<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="conversionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.02" />
    </linearGradient>
  </defs>
  
  <!-- Background box -->
  <rect x="0" y="0" width="400" height="300" fill="url(#conversionGrad)" rx="16"/>
  
  <!-- Checkout frame - centered and contained -->
  <rect x="60" y="50" width="280" height="200" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Cart items - inside frame -->
  <rect x="90" y="75" width="220" height="30" rx="3" fill="#10b981" opacity="0.06"/>
  <circle cx="110" cy="90" r="8" fill="#10b981" opacity="0.15"/>
  <text x="125" y="94" font-family="Arial, sans-serif" font-size="9" fill="#10b981" font-weight="500" opacity="0.6">Item 1</text>
  <text x="290" y="94" font-family="Arial, sans-serif" font-size="9" fill="#10b981" text-anchor="end" opacity="0.6">$29</text>
  
  <rect x="90" y="115" width="220" height="30" rx="3" fill="#10b981" opacity="0.06"/>
  <circle cx="110" cy="130" r="8" fill="#10b981" opacity="0.15"/>
  <text x="125" y="134" font-family="Arial, sans-serif" font-size="9" fill="#10b981" font-weight="500" opacity="0.6">Item 2</text>
  <text x="290" y="134" font-family="Arial, sans-serif" font-size="9" fill="#10b981" text-anchor="end" opacity="0.6">$19</text>
  
  <!-- Total line - inside frame -->
  <line x1="90" y1="160" x2="310" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.2"/>
  <text x="290" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="end" opacity="0.7">Total: $48</text>
  
  <!-- Nudge - inside frame -->
  <rect x="120" y="195" width="160" height="40" rx="6" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1.5"/>
  <text x="200" y="212" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle" opacity="0.7">10% Off</text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="8" fill="#10b981" text-anchor="middle" opacity="0.5">Code: SAVE10</text>
  
  <!-- Arrow - contained -->
  <path d="M200 195 L200 175" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.3"/>
  <path d="M196 180 L200 175 L204 180" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3"/>
  
  <!-- Success check - contained -->
  <circle cx="330" cy="160" r="12" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <path d="M325 160 L329 164 L335 157" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
