name: 'Checks'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-check:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Lint and Capture Output
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          yarn lint 2>&1 | tee lint-output.txt || true
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Comment PR with Lint Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let lintOutput = '';
            let exitCode = 0;

            try {
              lintOutput = fs.readFileSync('lint-output.txt', 'utf8');
              exitCode = parseInt(process.env.LINT_EXIT_CODE || '0');
            } catch (error) {
              lintOutput = 'Unable to read lint output';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const lintComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 🔍 Lint Results')
            );

            let commentBody = '## 🔍 Lint Results\n\n';

            const errorCount = lintOutput.split('\n').filter(line => line.includes('error')).length;
            const warningCount = lintOutput.split('\n').filter(line => line.includes('warning')).length;

            if (errorCount === 0 && warningCount === 0) {
              commentBody += '✅ **All lint checks passed!**\n\n';
            } else if (errorCount === 0 && warningCount > 0) {
              commentBody += '⚠️ **Lint warnings found:**\n\n';
            } else {
              commentBody += '🛑 **Lint problems found:**\n\n';
            }

            // Extract summary if available (like "56 problems (0 errors, 56 warnings)")
            const summaryMatch = lintOutput.match(/(\d+)\s+problems?\s*\((\d+)\s+errors?,\s*(\d+)\s+warnings?\)/);
            if (summaryMatch) {
              const [_, total, errors, warnings] = summaryMatch;
              commentBody += `**Summary:** ${total} problems (${errors} errors, ${warnings} warnings)\n\n`;
            } else {
              commentBody += '_No summary found._\n\n';
            }

            commentBody += '\n---\n';

            if (lintComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: lintComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
        env:
          LINT_EXIT_CODE: ${{ steps.lint.outputs.exit_code }}

  unit-test-check:
    name: Unit Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests with Coverage
        run: |
          yarn test --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=html --coverageReporters=json-summary

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Comment PR with Coverage Report
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
            let coverageData = {};
            if (fs.existsSync(summaryPath)) {
              coverageData = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            }
            let coverageTable = '## 📊 Test Coverage Report\n\n';
            coverageTable += '| File | Statements | Branches | Functions | Lines |\n';
            coverageTable += '|------|------------|----------|-----------|-------|\n';
            if (coverageData.total) {
              const total = coverageData.total;
              coverageTable += `| **Total** | ${total.statements.pct}% | ${total.branches.pct}% | ${total.functions.pct}% | ${total.lines.pct}% |\n`;
            }
            for (const file in coverageData) {
              if (file !== 'total') {
                const data = coverageData[file];
                const shortFile = path.basename(file);
                coverageTable += `| ${shortFile} | ${data.statements.pct}% | ${data.branches.pct}% | ${data.functions.pct}% | ${data.lines.pct}% |\n`;
              }
            }
            coverageTable += '\n---\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const coverageComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 📊 Test Coverage Report')
            );

            if (coverageComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: coverageComment.id,
                body: coverageTable
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: coverageTable
              });
            }

      - name: List coverage directory
        run: ls -l coverage

  type-check:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Type Check
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn app:check
