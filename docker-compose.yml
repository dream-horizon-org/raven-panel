services:
  raven-panel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_GOOGLE_CLIENT_SECRET=${NEXT_PUBLIC_GOOGLE_CLIENT_SECRET}
        - NEXT_PUBLIC_BASE_URL_PROD=${NEXT_PUBLIC_BASE_URL_PROD}
        - NEXT_PUBLIC_BASE_URL_UAT=${NEXT_PUBLIC_BASE_URL_UAT}
        - NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV}
        - NEXT_PUBLIC_ENABLE_COHORT=${NEXT_PUBLIC_ENABLE_COHORT}
        - NEXT_PUBLIC_COHORT_URL_PROD=${NEXT_PUBLIC_COHORT_URL_PROD}
        - NEXT_PUBLIC_COHORT_URL_UAT=${NEXT_PUBLIC_COHORT_URL_UAT}
        - NEXT_PUBLIC_EVENT_URL_PROD=${NEXT_PUBLIC_EVENT_URL_PROD}
        - NEXT_PUBLIC_EVENT_URL_UAT=${NEXT_PUBLIC_EVENT_URL_UAT}
        - NEXT_PUBLIC_SYSTEM_PROPERTIES_URL=${NEXT_PUBLIC_SYSTEM_PROPERTIES_URL}
        - NEXT_PUBLIC_ENABLE_PERMISSION=${NEXT_PUBLIC_ENABLE_PERMISSION}
        - NEXT_PUBLIC_PERMISSION_S3_URL=${NEXT_PUBLIC_PERMISSION_S3_URL}
        - NEXT_PUBLIC_ORGANIZATIONS_ENABLE_TENANT=${NEXT_PUBLIC_ORGANIZATIONS_ENABLE_TENANT}
        - NEXT_PUBLIC_ORGANIZATIONS=${NEXT_PUBLIC_ORGANIZATIONS}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthcheck.txt', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

